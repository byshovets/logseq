name: Build self-host image

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: self-host-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/byshovets/logseq
  RUNTIME_CONTAINER: logseq-selfhost-ci
  DEV_CONTAINER: logseq-selfhost-smoke-dev

jobs:
  build-test-publish:
    name: Build, verify, and publish amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Record build start
        run: echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The standard runner exposes only 14 GB of SSD. Remove large, unrelated
      # SDKs before the Clojure/Node multi-stage build starts.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Compute immutable image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          version=$(git describe --long --always --dirty)
          test "${version%-dirty}" = "$version"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build local runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scripts/self-host/Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            SELF_HOST=true
            SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=self-host-amd64
          cache-to: type=gha,scope=self-host-amd64,mode=min

      - name: Start hardened runtime and verify health
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
          DATA_DIR: ${{ runner.temp }}/logseq-selfhost-data
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE_TAG")" = amd64
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_TAG")" = node
          install -d -m 0777 "$DATA_DIR"
          docker run --detach --name "$RUNTIME_CONTAINER" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:8080:8080 \
            --publish 127.0.0.1:8787:8787 \
            --volume "$DATA_DIR:/data" \
            "$IMAGE_TAG"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs "$RUNTIME_CONTAINER"
              exit 1
            fi
            sleep 2
          done
          docker exec "$RUNTIME_CONTAINER" sh -euc '
            test "$(id -u)" -ne 0
            touch /data/.write-check
            touch /tmp/.write-check
            if touch /app/.must-not-write 2>/dev/null; then exit 1; fi
            if touch /usr/local/.must-not-write 2>/dev/null; then exit 1; fi
            rm /data/.write-check /tmp/.write-check
          '

      - name: Build and start smoke-test dev frontend
        env:
          DEV_IMAGE: logseq-selfhost-smoke-dev:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file scripts/self-host/Dockerfile \
            --platform linux/amd64 \
            --target smoke-dev \
            --build-arg SELF_HOST=true \
            --load \
            --tag "$DEV_IMAGE" \
            .
          # Both loaded images now live in Docker's store and the minimum GHA
          # cache is already exported. Drop BuildKit's duplicate local layers
          # before starting Chrome on the 14 GB runner.
          docker buildx prune --all --force
          df -h /
          docker run --detach --name "$DEV_CONTAINER" \
            --network host \
            "$DEV_IMAGE"
          # Shadow CLJS's dev server exposes index.html before the application
          # and worker compilers finish. Wait for every browser boot artifact;
          # otherwise Playwright opens an inert page while compilation is still
          # running and times out before #main-content-container can exist.
          for attempt in $(seq 1 120); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3001/index.html && \
               curl --fail --silent --output /dev/null http://127.0.0.1:3001/static/js/main.js && \
               curl --fail --silent --output /dev/null http://127.0.0.1:3001/static/js/db-worker.js && \
               curl --fail --silent --output /dev/null http://127.0.0.1:3001/static/js/db-worker-bundle.js; then
              break
            fi
            if [ "$attempt" = 120 ]; then
              docker logs "$DEV_CONTAINER"
              exit 1
            fi
            sleep 5
          done

      - name: Set up Node for smoke driver
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.18.0'

      - name: Install isolated smoke-driver dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          SMOKE_MODULES_DIR: ${{ runner.temp }}/logseq-selfhost-smoke-modules
        run: npm install --prefix "$SMOKE_MODULES_DIR" --no-save --no-audit --no-fund playwright@1.58.2 better-sqlite3@12.9.0

      - name: Run browser synchronization smoke test
        env:
          APP_URL: http://127.0.0.1:3001/index.html
          APP_URL_B: http://127.0.0.1:8080/
          DB_SYNC_DATA_DIR: ${{ runner.temp }}/logseq-selfhost-data
          SMOKE_MODULES_DIR: ${{ runner.temp }}/logseq-selfhost-smoke-modules
        run: node scripts/self-host/smoke-test.js

      - name: Stop test containers
        if: success()
        env:
          DEV_IMAGE: logseq-selfhost-smoke-dev:${{ github.sha }}
        run: |
          docker rm --force "$DEV_CONTAINER" "$RUNTIME_CONTAINER"
          docker image rm "$DEV_IMAGE"
          df -h /

      - name: Scan final runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          timeout: 15m0s
          version: v0.70.0

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
          format: spdx-json
          output-file: self-host.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit tag and record repository digest
        id: publish
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          existing_manifest=$(docker buildx imagetools inspect --raw "$IMAGE_TAG" 2>/dev/null || true)
          if [ -n "$existing_manifest" ]; then
            remote_config=$(jq -r '.config.digest // empty' <<<"$existing_manifest")
            local_config=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")
            if [ -z "$remote_config" ] || [ "$remote_config" != "$local_config" ]; then
              echo "Refusing to overwrite existing commit tag with different content: $IMAGE_TAG" >&2
              exit 1
            fi
            echo "Commit tag already names this exact image; leaving it unchanged."
          else
            docker push "$IMAGE_TAG"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '$1 == "Digest:" {print $2; exit}')
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          image_ref="${IMAGE_NAME}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image_ref" > self-host-image.txt

      - name: Create SLSA provenance predicate
        run: |
          set -euo pipefail
          jq -n \
            --arg buildType "https://mobyproject.org/buildkit@v1" \
            --arg builder "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg commit "$GITHUB_SHA" \
            --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg invocationId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg source "git+https://github.com/${GITHUB_REPOSITORY}.git" \
            --arg startedAt "$BUILD_STARTED_AT" \
            '{
              buildDefinition: {
                buildType: $buildType,
                externalParameters: {
                  source: {uri: $source, digest: {sha1: $commit}},
                  dockerfile: "scripts/self-host/Dockerfile",
                  platform: "linux/amd64",
                  buildArgs: {SELF_HOST: "true"}
                },
                internalParameters: {},
                resolvedDependencies: [
                  {uri: "pkg:docker/node@24.18.0-bookworm-slim", digest: {sha256: "6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d"}},
                  {uri: "pkg:docker/clojure@temurin-21-tools-deps-1.12.5.1654-bookworm-slim", digest: {sha256: "29b6b3e99e954aef27c0377f041505ac1bd494f8e72d9148c2b73c241f7e0dd5"}}
                ]
              },
              runDetails: {
                builder: {id: $builder},
                metadata: {
                  invocationId: $invocationId,
                  startedOn: $startedAt,
                  finishedOn: $finishedAt
                }
              }
            }' > self-host-provenance.json
          jq -e '.buildDefinition and .runDetails' self-host-provenance.json >/dev/null

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image and attach SBOM and provenance
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image-ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate self-host.spdx.json "$IMAGE_REF"
          cosign attest --yes --type slsaprovenance1 --predicate self-host-provenance.json "$IMAGE_REF"

      - name: Verify published signatures and attestations
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image-ref }}
        run: |
          set -euo pipefail
          # This is a regular expression, not a shell interpolation.
          # shellcheck disable=SC2016
          identity='^https://github\.com/byshovets/logseq/\.github/workflows/build-self-host\.yml@refs/heads/.+$'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type slsaprovenance1 --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE_REF" >/dev/null

      - name: Upload digest, SBOM, and provenance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-host-${{ steps.metadata.outputs.tag }}
          path: |
            self-host-image.txt
            self-host.spdx.json
            self-host-provenance.json
          retention-days: 7
          if-no-files-found: error

      - name: Write deployment summary
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image-ref }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.tag }}
        run: |
          {
            echo '## Self-host image published'
            echo
            echo "- Commit tag: \`$IMAGE_TAG\`"
            echo "- Deploy exactly: \`$IMAGE_REF\`"
            echo "- Platform: \`linux/amd64\`"
            echo '- Runtime, smoke, vulnerability scan, signature, SBOM, and provenance verification passed.'
            echo
            echo 'Do not copy the tag into Ansible; copy the digest-qualified reference.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs on failure and clean up
        if: always()
        run: |
          docker logs --tail 250 "$DEV_CONTAINER" 2>/dev/null || true
          docker logs --tail 250 "$RUNTIME_CONTAINER" 2>/dev/null || true
          docker rm --force "$DEV_CONTAINER" "$RUNTIME_CONTAINER" 2>/dev/null || true
